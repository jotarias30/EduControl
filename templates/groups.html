{% extends 'base.html' %}{% block content %}<h2>Grupos</h2><form method="post" class="row g-2 mb-4"><div class="col"><input class="form-control" name="name" placeholder="Ej. 4-A" required></div><div class="col"><input class="form-control" name="year" type="number" value="2026" required></div><div class="col-auto"><button class="btn btn-primary">Crear</button></div></form><table class="table"><tr><th>Grupo</th><th>Año</th></tr>{% for g in groups %}<tr><td>{{g.name}}</td><td>{{g.year}}</td></tr>{% endfor %}</table>{% endblock %}
