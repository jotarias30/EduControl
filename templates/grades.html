{% extends 'base.html' %}{% block content %}<h2>{{activity.title}}</h2><p>{{activity.subject.name}} · {{activity.component}} · máximo {{activity.max_points}}</p><form method="post"><table class="table"><tr><th>Estudiante</th><th>Puntos</th></tr>{% for s in students %}<tr><td>{{s.full_name}}</td><td><input class="form-control" type="number" step="0.01" min="0" max="{{activity.max_points}}" name="g_{{s.id}}" value="{{existing.get(s.id,'')}}"></td></tr>{% endfor %}</table><button class="btn btn-primary">Guardar notas</button></form>{% endblock %}
