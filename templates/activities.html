{% extends 'base.html' %}{% block content %}<h2>Evaluación · {{subject.name}}</h2><form method="post" class="row g-2 mb-4"><div class="col"><input class="form-control" name="title" placeholder="Actividad" required></div><div class="col"><select class="form-select" name="component"><option>Trabajo cotidiano</option><option>Tarea</option><option>Prueba</option><option>Proyecto</option><option>Otro</option></select></div><div class="col"><input class="form-control" name="max_points" type="number" step="0.01" value="100"></div><div class="col-auto"><button class="btn btn-primary">Crear</button></div></form><div class="list-group">{% for a in activities %}<a class="list-group-item list-group-item-action" href="{{url_for('grades',activity_id=a.id)}}"><b>{{a.title}}</b> · {{a.component}} · {{a.max_points}} pts</a>{% endfor %}</div>{% endblock %}
