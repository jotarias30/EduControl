{% extends 'base.html' %}{% block content %}<h2>Asistencia · {{subject.name}}</h2><form method="post"><input class="form-control mb-3" style="max-width:220px" type="date" name="day" value="{{day}}"><table class="table"><tr><th>Estudiante</th><th>Estado</th></tr>{% for s in students %}<tr><td>{{s.full_name}}</td><td><select class="form-select" name="s_{{s.id}}"><option value="P" {% if existing.get(s.id,'P')=='P' %}selected{% endif %}>Presente</option><option value="A" {% if existing.get(s.id)=='A' %}selected{% endif %}>Ausente</option><option value="J" {% if existing.get(s.id)=='J' %}selected{% endif %}>Justificada</option><option value="T" {% if existing.get(s.id)=='T' %}selected{% endif %}>Tardía</option></select></td></tr>{% endfor %}</table><button class="btn btn-primary">Guardar asistencia</button></form>{% endblock %}
