{% extends 'base.html' %}{% block content %}<h2>Editar usuario</h2><div class="card p-4" style="max-width:650px"><form method="post"><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" name="name" value="{{teacher.name}}" required></div><div class="mb-3"><label class="form-label">Correo</label><input class="form-control" type="email" name="email" value="{{teacher.email}}" required></div><div class="mb-3"><label class="form-label">Rol</label><select class="form-select" name="role"><option value="teacher" {% if teacher.role=='teacher' %}selected{% endif %}>Docente</option><option value="direction" {% if teacher.role=='direction' %}selected{% endif %}>Dirección</option><option value="admin" {% if teacher.role=='admin' %}selected{% endif %}>Administrador</option></select></div><button class="btn btn-primary">Guardar</button> <a class="btn btn-light" href="{{url_for('teachers')}}">Cancelar</a></form></div>{% endblock %}
