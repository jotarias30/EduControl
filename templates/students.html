{% extends 'base.html' %}{% block content %}<h2>Estudiantes</h2><form method="post" class="card p-3 mb-4"><div class="row g-2"><div class="col-md-4"><input class="form-control" name="full_name" placeholder="Nombre completo" required></div><div class="col-md-2"><input class="form-control" name="identification" placeholder="Identificación"></div><div class="col-md-3"><input class="form-control" name="guardian_name" placeholder="Encargado"></div><div class="col-md-2"><input class="form-control" name="guardian_phone" placeholder="Teléfono"></div><div class="col-md-2"><select class="form-select" name="group_id" required>{% for g in groups %}<option value="{{g.id}}">{{g.name}}</option>{% endfor %}</select></div><div class="col-auto"><button class="btn btn-primary">Registrar</button></div></div></form><table class="table align-middle"><tr><th>Nombre</th><th>Grupo</th><th>Encargado</th><th></th></tr>{% for s in students %}<tr class="{% if not s.active %}text-muted{% endif %}"><td>{{s.full_name}}</td><td>{{s.group.name}}</td><td>{{s.guardian_name or ''}}</td><td>{% if s.active %}<form method="post" action="{{url_for('student_delete',sid=s.id)}}"><button class="btn btn-sm btn-outline-danger">Desactivar</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
