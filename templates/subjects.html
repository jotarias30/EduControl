{% extends 'base.html' %}{% block content %}<h2>Materias</h2><form method="post" class="row g-2 mb-4"><div class="col"><input class="form-control" name="name" placeholder="Matemáticas" required></div><div class="col"><select class="form-select" name="group_id">{% for g in groups %}<option value="{{g.id}}">{{g.name}}</option>{% endfor %}</select></div><div class="col-auto"><button class="btn btn-primary">Agregar</button></div></form><div class="list-group">{% for s in subjects %}<div class="list-group-item d-flex justify-content-between"><span><b>{{s.name}}</b> · {{s.group.name}}</span><span><a class="btn btn-sm btn-outline-primary" href="{{url_for('attendance',subject_id=s.id)}}">Asistencia</a> <a class="btn btn-sm btn-outline-secondary" href="{{url_for('activities',subject_id=s.id)}}">Evaluación</a> <a class="btn btn-sm btn-success" href="{{url_for('grades_excel',subject_id=s.id)}}">Excel</a></span></div>{% endfor %}</div>{% endblock %}
