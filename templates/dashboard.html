{% extends 'base.html' %}{% block content %}<h1>Hola, {{current_user.name}}</h1><div class="row g-3 my-3"><div class="col-md-4"><div class="card stat"><b>{{students}}</b><span>Estudiantes activos</span></div></div><div class="col-md-4"><div class="card stat"><b>{{groups|length}}</b><span>Grupos</span></div></div></div><h3>Mis grupos</h3><div class="row g-3">{% for g in groups %}<div class="col-md-4"><div class="card p-3"><b>{{g.name}}</b><span>{{g.year}}</span></div></div>{% else %}<p>Crea tu primer grupo.</p>{% endfor %}</div>{% endblock %}
